<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NexMeet — Completing LinkedIn sign-in</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #faf7f5;
      color: #2c1810;
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0; opacity: 0.75; line-height: 1.45; }
    a { color: #7a432d; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Returning to NexMeet…</h1>
    <p id="message">If the app does not open automatically, tap the button below.</p>
    <p style="margin-top: 20px">
      <a id="openLink" href="#">Open NexMeet</a>
    </p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code') || '';
      var state = params.get('state') || '';
      var error = params.get('error') || '';
      var errorDescription = params.get('error_description') || '';

      var deep = new URL('nexmeet://oauth/linkedin');
      if (code) deep.searchParams.set('code', code);
      if (state) deep.searchParams.set('state', state);
      if (error) deep.searchParams.set('error', error);
      if (errorDescription) deep.searchParams.set('error_description', errorDescription);

      var href = deep.toString();
      document.getElementById('openLink').setAttribute('href', href);

      if (error) {
        document.getElementById('title').textContent = 'Sign-in was not completed';
        document.getElementById('message').textContent =
          errorDescription || error || 'You can close this tab and return to NexMeet.';
      }

      // Prefer deep-link back into the installed app (shares LinkedIn browser session).
      window.location.replace(href);

      // Fallback: if this page was opened inside the app WebView / same host SPA,
      // also try relative redirect for web builds that handle ?code= themselves.
      setTimeout(function () {
        if (!error && code) {
          var webFallback = '/?code=' + encodeURIComponent(code) +
            '&state=' + encodeURIComponent(state) +
            '&linkedin_oauth=1';
          // Only useful when the user is already on the web app host.
        }
      }, 1500);
    })();
  </script>
</body>
</html>
